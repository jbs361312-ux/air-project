<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>전북 대기오염 정보</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb');
    background-size: cover;
    background-position: center;
    color: white;
    text-align: center;
}

.overlay {
    background: rgba(0,0,0,0.55);
    min-height: 100vh;
    padding: 30px;
}

h1 {
    font-size: 42px;
}

button {
    background: #00b894;
    border: none;
    padding: 15px 30px;
    color: white;
    font-size: 18px;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background: #019875;
}

#result {
    margin-top: 30px;
}

.card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    width: 320px;
    margin: 20px auto;
    padding: 20px;
    border-radius: 20px;
}

.station {
    font-size: 28px;
    font-weight: bold;
}

.good {
    color: #74b9ff;
}

.normal {
    color: #55efc4;
}

.bad {
    color: #fdcb6e;
}

.verybad {
    color: #ff7675;
}

.chart-box {
    width: 90%;
    max-width: 800px;
    margin: 40px auto;
    background: rgba(255,255,255,0.12);
    padding: 20px;
    border-radius: 20px;
}

canvas {
    background: white;
    border-radius: 15px;
    padding: 10px;
}

</style>

</head>
<body>

<div class="overlay">

<h1>🌍 전북 대기오염 정보</h1>

<button onclick="loadAir()">조회하기</button>

<div id="result"></div>

<div class="chart-box">
    <canvas id="airChart"></canvas>
</div>

</div>

<script>

let chart;

async function loadAir() {

    const serviceKey =
    "b9cab6c43f4ab438fb2bc7869c251889d5c75a7174ac9528b97cf48059d37eb0";

    const url =
`https://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getCtprvnRltmMesureDnsty?serviceKey=${encodeURIComponent(serviceKey)}&returnType=json&numOfRows=5&pageNo=1&sidoName=전북&ver=1.0`;

    try {

        const response = await fetch(url);
        const data = await response.json();

        const items = data.response.body.items;

        let resultHTML = "";

        let labels = [];
        let pm10Data = [];

        for(let i = 0; i < items.length; i++) {

            const air = items[i];

            labels.push(air.stationName);
            pm10Data.push(air.pm10Value);

            let gradeText = "";
            let gradeClass = "";

            if(air.pm10Grade == "1") {
                gradeText = "좋음";
                gradeClass = "good";
            }

            else if(air.pm10Grade == "2") {
                gradeText = "보통";
                gradeClass = "normal";
            }

            else if(air.pm10Grade == "3") {
                gradeText = "나쁨";
                gradeClass = "bad";
            }

            else {
                gradeText = "매우 나쁨";
                gradeClass = "verybad";
            }

            resultHTML += `
            <div class="card">

                <div class="station">
                    ${air.stationName}
                </div>

                <p>미세먼지: ${air.pm10Value}</p>

                <p>초미세먼지: ${air.pm25Value}</p>

                <p class="${gradeClass}">
                    상태: ${gradeText}
                </p>

            </div>
            `;
        }

        document.getElementById("result").innerHTML =
            resultHTML;

        const ctx = document.getElementById('airChart');

        if(chart) {
            chart.destroy();
        }

        chart = new Chart(ctx, {

            type: 'bar',

            data: {
                labels: labels,

                datasets: [{
                    label: '미세먼지(PM10)',

                    data: pm10Data,

                    borderWidth: 1
                }]
            },

            options: {
                responsive: true,

                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

    } catch(error) {

        document.getElementById("result").innerHTML =
            "<h2>데이터 불러오기 실패</h2>";
    }
}

</script>

</body>
</html>
