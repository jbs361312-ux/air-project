<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>전북 대기오염 정보</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    text-align: center;
    color: white;
}

.overlay {
    background-color: rgba(0,0,0,0.5);
    min-height: 100vh;
    padding: 40px;
}

h1 {
    font-size: 42px;
    margin-bottom: 20px;
}

button {
    background-color: #00b894;
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 18px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background-color: #019875;
    transform: scale(1.05);
}

#result {
    margin-top: 40px;
}

.card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    width: 320px;
    margin: 20px auto;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.station {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 10px;
}

.icon {
    font-size: 50px;
    margin-bottom: 10px;
}

.good {
    color: #74b9ff;
}

.normal {
    color: #55efc4;
}

.bad {
    color: #fdcb6e;
}

.verybad {
    color: #ff7675;
}

p {
    font-size: 18px;
}

</style>

</head>
<body>

<div class="overlay">

<h1>🌍 전북 대기오염 정보</h1>

<button onclick="loadAir()">조회하기</button>

<div id="result"></div>

</div>

<script>

async function loadAir() {

    const serviceKey =
    "b9cab6c43f4ab438fb2bc7869c251889d5c75a7174ac9528b97cf48059d37eb0";

    const url =
`https://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getCtprvnRltmMesureDnsty?serviceKey=${encodeURIComponent(serviceKey)}&returnType=json&numOfRows=5&pageNo=1&sidoName=전북&ver=1.0`;

    try {

        const response = await fetch(url);
        const data = await response.json();

        const items = data.response.body.items;

        let resultHTML = "";

        for(let i = 0; i < items.length; i++) {

            const air = items[i];

            let gradeText = "";
            let gradeClass = "";
            let icon = "";

            if(air.pm10Grade == "1") {
                gradeText = "좋음";
                gradeClass = "good";
                icon = "😄";
            }

            else if(air.pm10Grade == "2") {
                gradeText = "보통";
                gradeClass = "normal";
                icon = "🙂";
            }

            else if(air.pm10Grade == "3") {
                gradeText = "나쁨";
                gradeClass = "bad";
                icon = "😷";
            }

            else {
                gradeText = "매우 나쁨";
                gradeClass = "verybad";
                icon = "☠️";
            }

            resultHTML += `
            <div class="card">

                <div class="icon">
                    ${icon}
                </div>

                <div class="station">
                    ${air.stationName}
                </div>

                <p>미세먼지: ${air.pm10Value}</p>

                <p>초미세먼지: ${air.pm25Value}</p>

                <p class="${gradeClass}">
                    상태: ${gradeText}
                </p>

                <p>통합대기지수: ${air.khaiValue}</p>

            </div>
            `;
        }

        document.getElementById("result").innerHTML =
            resultHTML;

    } catch(error) {

        document.getElementById("result").innerHTML =
            "<h2>데이터 불러오기 실패</h2>";
    }
}

</script>

</body>
</html>
